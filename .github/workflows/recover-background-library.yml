name: Recover background library

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Add missing recovered entries after a dry run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      APPLY: ${{ inputs.apply }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH secret}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS secret}"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Audit or recover saved backgrounds
        shell: bash
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          ssh -i "$HOME/.ssh/id_ed25519" -p "$port" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- '$DEPLOY_PATH' '$APPLY'" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          test -f data/dev.db
          test "$(cat .deploy_mode)" = docker
          if [ "$2" = true ]; then
            docker exec jinvoice-sfu node scripts/recover-background-library.js --apply
          else
            docker exec jinvoice-sfu node scripts/recover-background-library.js
            docker inspect --format '{{range .Mounts}}{{println .Destination}}{{end}}' jinvoice-sfu
            docker exec -i jinvoice-sfu node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { PrismaClient } = require('@prisma/client');
          const dataDir = '/app/data';
          const candidates = [{ label: 'current', file: path.join(dataDir, 'dev.db') }];
          for (const name of fs.readdirSync(dataDir).filter((value) => value.startsWith('recovery-')).sort()) {
            candidates.push({ label: `${name}/host`, file: path.join(dataDir, name, 'host-database', 'dev.db') });
            candidates.push({ label: `${name}/container`, file: path.join(dataDir, name, 'container-data', 'dev.db') });
          }
          (async () => {
            console.log(`databaseUrl=${process.env.DATABASE_URL} dataTarget=${fs.realpathSync('/app/server/data')}`);
            for (const candidate of candidates) {
              if (!fs.existsSync(candidate.file)) continue;
              const prisma = new PrismaClient({ datasources: { db: { url: `file:${candidate.file}` } } });
              try {
                const [users, rooms, appearance] = await Promise.all([
                  prisma.user.count(), prisma.room.count(), prisma.siteAppearance.findUnique({ where: { id: 1 } })
                ]);
                const library = JSON.parse(appearance?.backgroundMediaLibrary || '[]');
                const stat = fs.statSync(candidate.file);
                console.log(JSON.stringify({ label: candidate.label, bytes: stat.size, modifiedAt: stat.mtime.toISOString(), users, rooms, backgrounds: library.length, appearanceUpdatedAt: appearance?.updatedAt }));
              } catch (error) {
                console.log(JSON.stringify({ label: candidate.label, error: error.code || error.message }));
              } finally {
                await prisma.$disconnect();
              }
            }
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
            for media_id in \
              071f5438-cea7-4c9f-8252-e750c4b24c23 \
              04f2cc5e-63d4-4198-a9e5-5d372baf1113 \
              2ca26cf0-f479-4fe3-aece-dcc0dba42075; do
              echo "Searching saved media $media_id"
              find "$(dirname "$PWD")" -maxdepth 8 -type f -name "$media_id.*" -printf '%P\n'
            done
            for root in /home /root /opt /srv /var/www /www /mnt /data /usr/local /var/lib/docker/volumes; do
              [ -d "$root" ] || continue
              timeout 30 find "$root" -type f \( \
                -name '071f5438-cea7-4c9f-8252-e750c4b24c23.*' -o \
                -name '04f2cc5e-63d4-4198-a9e5-5d372baf1113.*' -o \
                -name '2ca26cf0-f479-4fe3-aece-dcc0dba42075.*' \
              \) -print 2>/dev/null || true
            done
            python3 - <<'PY'
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          ids = ('071f5438-cea7-4c9f-8252-e750c4b24c23',
                 '04f2cc5e-63d4-4198-a9e5-5d372baf1113',
                 '2ca26cf0-f479-4fe3-aece-dcc0dba42075')
          roots = [Path.cwd().parent, Path('/www/backup'), Path('/var/backups'),
                   Path('/home'), Path('/root'), Path('/opt'), Path('/srv')]
          seen = set()
          scanned = 0
          matches = []
          for root in roots:
              if not root.is_dir():
                  continue
              for directory, subdirs, files in os.walk(root):
                  depth = len(Path(directory).relative_to(root).parts)
                  subdirs[:] = [name for name in subdirs if name not in {'.git', '.cache', 'node_modules'}] if depth < 6 else []
                  for name in files:
                      archive = Path(directory) / name
                      if archive in seen or not (name.endswith('.zip') or name.endswith(('.tar.gz', '.tgz'))):
                          continue
                      seen.add(archive)
                      try:
                          if archive.stat().st_size > 2 * 1024 ** 3:
                              continue
                          scanned += 1
                          if name.endswith('.zip'):
                              with zipfile.ZipFile(archive) as source:
                                  found = any(any(value in entry for value in ids) for entry in source.namelist())
                          else:
                              with tarfile.open(archive, 'r|gz') as source:
                                  found = any(any(value in entry.name for value in ids) for entry in source)
                          if found:
                              matches.append(str(archive))
                      except (OSError, PermissionError, zipfile.BadZipFile, tarfile.TarError):
                          pass
                      if scanned >= 40:
                          break
                  if scanned >= 40:
                      break
              if scanned >= 40:
                  break
          print(f'backupArchivesScanned={scanned} matchingArchives={len(matches)}')
          for archive in matches:
              print(f'backupArchiveMatch={archive}')
          PY
          fi
          REMOTE

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519"
